<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f8f4f0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
        }
        .circle {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background-color: #e64a33;
            color: white;
            font-size: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }
        .button-group button {
            padding:12px 26px;
            margin: 0 10px;
            border: none;
            border-radius: 10px;
            font-size:18px;
            cursor: pointer;
        }
        #start{background:#27ae60;color:white;}
        #pause{background:#f39c12;color:white;}
        #reset{background:#34495e;color:white;}
    </style>
</head>
<body>
    <div class="circle" id="clock">25:00</div>
    <div class="button-group">
        <button id="start" onclick="startTimer()">开始</button>
        <button id="pause" onclick="pauseTimer()">暂停</button>
        <button id="reset" onclick="resetTimer()">重置</button>
    </div>

    <script>
        let totalSecond = 25 * 60;
        let timer = null;

        function renderTime(){
            let min = Math.floor(totalSecond / 60).toString().padStart(2,'0');
            let sec = (totalSecond % 60).toString().padStart(2,'0');
            document.getElementById("clock").innerText = `${min}:${sec}`;
        }

        function startTimer(){
            if(timer) return;
            timer = setInterval(()=>{
                totalSecond--;
                renderTime();
                if(totalSecond <=0){
                    clearInterval(timer);
                }
            },1000)
        }
        function pauseTimer(){
            clearInterval(timer);
            timer = null;
        }
        function resetTimer(){
            pauseTimer();
            totalSecond = 25 * 60;
            renderTime();
        }
        renderTime();
    </script>
</body>
</html>
